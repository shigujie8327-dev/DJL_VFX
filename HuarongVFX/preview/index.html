<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>花荣 VFX 预览</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main>
    <header><div><p class="eyebrow">斗将录 · VFX v1.1</p><h1>花荣特效素材预览</h1><p>图标视觉母版 → 分层透明素材 → 规则驱动演出</p></div><span class="badge">1920 × 1080 基准 · H=400</span></header>
    <section class="stage-shell"><div id="stage" class="stage"><div class="arena-line"></div><div class="actor caster"><span>花荣</span><b>弓</b></div><div class="actor target"><span>目标</span><b>靶</b></div><div id="effects"></div><div class="hud"><span>远距 / 近距由规则系统决定</span><strong id="event-label">选择技能预览</strong></div></div></section>
    <nav id="buttons" aria-label="技能预览"></nav>
    <div class="notes"><p><strong>连珠箭</strong> 四发箭和四次 Hit 分开播放，视觉可数。</p><p><strong>退身箭</strong> 命中结算后，成功与受阻的位移弧独立播放。</p><p><strong>定身箭</strong> 链纹表示主动变距额外 +20 气力，不代表完全无法移动。</p></div>
    <footer>可离线打开。点击任一技能重播；预览时序为视觉示例，正式战斗由事件驱动。</footer>
  </main>
  <script src="data.js"></script><script src="player.js"></script>
</body>
</html>
