<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>林冲 VFX 预览台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: battle-console — scenario rail | stage + layer lanes | acceptance sheet; asset ledger below.
   Deliberately single dark look: VFX are judged on a dark stage, so the whole console commits to it. */
:root {
  color-scheme: dark;
  --ink: #0e1013;          /* lacquer black ground */
  --panel: #161a1f;        /* raised console panel */
  --panel-2: #1d2229;
  --line: #2b313a;
  --fg: #e8e3d7;           /* rice-paper text */
  --muted: #8f95a1;
  --bronze: #c69a5b;       /* wiki icon frame bronze = accent */
  --bronze-dim: #7a5f3a;
  --ok: #7fbf8a; --warn: #e0b04f; --bad: #e0685f;
  --f-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--ink); color: var(--fg); }
body { font-family: var(--f-body); font-size: 14px; line-height: 1.55; margin: 0; padding: 20px 16px 48px; }
.wrap { max-width: 1480px; margin: 0 auto; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px;
  border-bottom: 1px solid var(--line); padding-bottom: 12px; }
h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(22px, 3vw, 30px); margin: 0; letter-spacing: .04em; text-wrap: balance; }
h1 small { font-family: var(--f-body); font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: .02em; margin-left: 10px; }
.meta { color: var(--muted); font-size: 12px; font-family: var(--f-mono); }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 18px; margin: 0; letter-spacing: .05em; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--bronze); font-family: var(--f-mono); }

.console { display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 1180px) { .console { grid-template-columns: 220px minmax(0, 1fr); } .sheet { grid-column: 1 / -1; } }
@media (max-width: 760px) { .console { grid-template-columns: minmax(0, 1fr); } }

/* scenario rail */
.rail { display: grid; gap: 14px; }
.skill { display: grid; gap: 6px; }
.skill-head { display: flex; align-items: center; gap: 10px; }
.skill-head img { width: 40px; height: 40px; border-radius: 6px; border: 1px solid var(--bronze-dim); flex: none; }
.skill-head b { font-family: var(--f-display); font-size: 15px; letter-spacing: .06em; display: block; }
.skill-head span { font-size: 11.5px; color: var(--muted); }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 3px; vertical-align: 0; }
.scn { appearance: none; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  font: inherit; font-size: 13px; padding: 7px 10px; border-radius: var(--r); cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.scn:hover { border-color: var(--bronze-dim); }
.scn[aria-pressed="true"] { border-color: var(--bronze); background: var(--panel-2); box-shadow: inset 3px 0 0 var(--bronze); }
.scn em { font-style: normal; font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
@media (max-width: 760px) { .rail { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }

/* stage */
.stagebox { display: grid; gap: 10px; min-width: 0; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: #000; }
.stage canvas { width: 100%; height: 100%; display: block; }
.transport { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; font-size: 13px;
  padding: 6px 12px; border-radius: var(--r); cursor: pointer; }
.btn:hover { border-color: var(--bronze-dim); }
.btn.primary { background: var(--bronze); border-color: var(--bronze); color: #1a140b; font-weight: 700; min-width: 76px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { appearance: none; border: 0; background: var(--panel); color: var(--muted); font: inherit; font-size: 12px; padding: 6px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); box-shadow: inset 0 -2px 0 var(--bronze); }
.tc { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--fg); margin-left: auto; }
.tc span { color: var(--muted); }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); cursor: pointer; }
:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }

/* layer lanes */
.lanes { position: relative; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 8px 10px 8px 118px; cursor: pointer; user-select: none; }
.lane { position: relative; height: 15px; border-bottom: 1px dashed #232830; }
.lane:last-child { border-bottom: 0; }
.lane i { position: absolute; left: -110px; top: 0; font-style: normal; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); line-height: 15px; }
.lane b { position: absolute; top: 3px; height: 9px; border-radius: 2px; opacity: .85; min-width: 3px; }
.lane .mk { position: absolute; top: 1px; width: 2px; height: 13px; background: var(--fg); }
.playhead { position: absolute; top: 4px; bottom: 4px; width: 2px; background: var(--bronze); pointer-events: none; box-shadow: 0 0 6px var(--bronze); }
.lanes-axis { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); padding-left: 118px; margin-top: -4px; }

/* acceptance sheet */
.sheet { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.sheet h3 { margin: 0; font-family: var(--f-display); font-size: 17px; letter-spacing: .05em; }
.dna { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.dna .chip { width: 22px; height: 22px; border-radius: 4px; border: 1px solid #0006; }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; margin: 0; font-size: 12.5px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.pill { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 999px; border: 1px solid currentColor; line-height: 18px; margin-left: 6px; font-family: var(--f-mono); }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.info { color: var(--muted); }
.note { font-size: 12px; color: var(--muted); }
ul.assets-used { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-family: var(--f-mono); font-size: 11.5px; }
ul.assets-used a { color: var(--fg); text-decoration: none; border-bottom: 1px dotted var(--muted); }
ul.assets-used a:hover { color: var(--bronze); }

/* gallery */
.gal-head { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-end; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 18px; }
.gal-group { display: grid; gap: 10px; }
.gal-group > h4 { margin: 8px 0 0; font-family: var(--f-display); font-size: 15px; letter-spacing: .06em; color: var(--fg); display: flex; gap: 10px; align-items: baseline; }
.gal-group > h4 span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.card:target { border-color: var(--bronze); box-shadow: 0 0 0 1px var(--bronze); }
.card canvas { width: 100%; aspect-ratio: 16 / 10; display: block; }
.card .info { padding: 8px 10px 10px; display: grid; gap: 3px; min-width: 0; }
.card .key { font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; overflow-wrap: anywhere; }
.card .dims { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .desc { font-size: 12px; color: #c3bfb5; }
.card .path { font-family: var(--f-mono); font-size: 10px; color: var(--muted); overflow-wrap: anywhere; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--f-mono); font-size: 13px; background: #0b0c0e; }
footer { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
@media (prefers-reduced-motion: reduce) { .playhead { box-shadow: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">斗将录：梁山篇 · Battle VFX v1.1</div>
      <h1>林冲 · 豹子头<small>四主动 + 固有能力 · 动态特效预览</small></h1>
    </div>
    <div class="meta" id="meta"></div>

  <section class="console">

        <div class="seg" id="speed" role="group" aria-label="播放速度">

          <button type="button" data-v="0.1">0.1×</button>
        </div>
        <div class="seg" id="bg" role="group" aria-label="背景">
          <button type="button" data-v="battle" aria-pressed="true">战场</button>
          <button type="button" data-v="light">亮底</button>
          <button type="button" data-v="checker">棋盘格</button>
        </div>
        <label class="chk"><input type="checkbox" id="loop" checked> 循环</label>
        <label class="chk"><input type="checkbox" id="debug"> Anchor / UI 安全区</label>
        <span class="tc" id="tc">0.000 <span>/ 0.000 s</span></span>
      </div>
      <div class="lanes" id="lanes" title="点击跳转时间"></div>
      <div class="lanes-axis" id="axis"></div>
    </div>

    <aside class="sheet" id="sheet" aria-live="polite"></aside>
  </section>

  <section class="gal-head">
    <div>
      <div class="eyebrow">Characters/Linchong</div>
      <h2>素材清单</h2>
    </div>
    <div class="seg" id="gbg" role="group" aria-label="素材背景">
      <button type="button" data-v="dark" aria-pressed="true">暗底</button>
      <button type="button" data-v="checker">透明棋盘格</button>
      <button type="button" data-v="light">亮底</button>
    </div>
  </section>
  <section id="gallery" style="display:grid;gap:14px"></section>

  <footer>
    素材由 <code>tools/vfx/gen_linchong.py</code> 程序化生成：RGBA 真透明、无人物 / 文字 / 背景，紧裁切，pivot 写入 manifest 的 anchor（Cocos anchorPoint）。
    人物为占位剪影（林冲定稿立绘尚未接入 Wiki），角色高度 H = 520 px，舞台 1920×1080。
  </footer>
</div>

<script>
(() => {
'use strict';
const M = window.LC_VFX_MANIFEST;
const A = M.anchors, H = A.H, LAYERS = M.layers;
const SKILLS = {
  Jifengci:       { name: '疾风刺',   icon: 'preview/wiki_icons/linchong-01_jifengci.webp',       dna: '赤红 / 银白', colors: ['#ff1a22', '#e4ecf6'], mech: '高速突刺 · 打断', rule: '近 · 20 气 · 26×1 · 速度 8' },
  Huimaqiang:     { name: '回马枪',   icon: 'preview/wiki_icons/linchong-02_huimaqiang.webp',     dna: '铜橙 / 金白', colors: ['#ff6a1c', '#ffe7b0'], mech: '受击 → 回身 → 反刺', rule: '近 · 30 气 · 35×1 / 55×1 · 速度 3' },
  Hengsaoqianjun: { name: '横扫千军', icon: 'preview/wiki_icons/linchong-03_hengsaoqianjun.webp', dna: '橙金 / 银白', colors: ['#ff9a1e', '#e4ecf6'], mech: '横扫 · 强制变距 近→远', rule: '近 · 45 气 · 62×1 · 速度 2' },
  Qiangzhen:      { name: '枪阵',     icon: 'preview/wiki_icons/linchong-04_qiangzhen.webp',      dna: '冰蓝 / 银白', colors: ['#3f9bff', '#e4ecf6'], mech: '阵地 · 阻止远→近尝试', rule: '远 · 30 气 · 32×1 · 速度 7' },
  Baozitou:       { name: '固有·豹子头', icon: 'preview/wiki_icons/linchong-05_baozitou.webp',   dna: '香槟金 / 银灰', colors: ['#f2d49a', '#a9adb4'], mech: '打断/截击后，下一次攻击速度 +2', rule: '固有能力 · 被动' },
};
const LAYER_COL = { BattleFX_Back: '#3f7fd0', Status_Back: '#6f8fb0', Character: '#777', WeaponTrail: '#d0663f',
  SkillFX: '#c69a5b', Projectile: '#b07ad0', HitFX: '#e8e3d7', Status_Front: '#8fc0a0', BattleUI: '#999' };
const GROUP_NAME = { Jifengci: '疾风刺 Jifengci', Huimaqiang: '回马枪 Huimaqiang', Hengsaoqianjun: '横扫千军 Hengsaoqianjun',
  Qiangzhen: '枪阵 Qiangzhen', Baozitou: '固有·豹子头 Baozitou', CommonFX: '通用 CommonFX', UI: '战斗 UI 图标' };

const $ = (id) => document.getElementById(id);
const cv = $('stage'), ctx = cv.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------- assets
const imgs = {};
function loadAll() {
  const jobs = [];
  for (const [k, a] of Object.entries(M.assets)) {
    imgs[k] = a.files.map((f) => {
      const im = new Image();
      jobs.push(new Promise((res) => { im.onload = res; im.onerror = res; }));
      im.src = a.dir + '/' + f;
      return im;
    });
  }
  return Promise.all(jobs);
}

// ---------------------------------------------------------------- math
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const easeInOut = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function track(k, u, def) {
  if (!k) return def;
  if (u <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) {
    if (u <= k[i][0]) { const a = k[i - 1], b = k[i]; return lerp(a[1], b[1], (u - a[0]) / Math.max(1e-6, b[0] - a[0])); }
  }
  return k[k.length - 1][1];
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------------------------------------------------------------- state
const S = { id: null, tl: null, t: 0, playing: !reduced, speed: 1, loop: true, bg: 'battle', debug: false, hold: 0 };
function hitstops(tl) { return tl.events.filter((e) => e.type === 'hitstop').sort((a, b) => a.t - b.t); }
function realDuration(tl) { return tl.duration + hitstops(tl).reduce((s, e) => s + e.dur, 0); }
function effTime(tl, tr) {
  let shift = 0;
  for (const h of hitstops(tl)) {
    const start = h.t + shift;
    if (tr < start) break;
    if (tr < start + h.dur) return h.t;
    shift += h.dur;
  }
  return tr - shift;
}

// ---------------------------------------------------------------- scene evaluation
function moveOffset(tl, actor, te) {
  let x = 0, y = 0, r = 0;
  for (const e of tl.events) {
    if (e.type !== 'move' || e.actor !== actor || te < e.t) continue;
    const u = clamp((te - e.t) / e.dur, 0, 1);
    x += track(e.x, u, 0); y += track(e.y, u, 0); r += track(e.rot, u, 0);
  }
  return { x, y, r };
}
function targetRoot(tl, te) {
  let dist = tl.setup.distance, x = A.Target_root[dist][0], state = { dist, blocked: false, moving: false };
  for (const e of tl.events) {
    if (e.type !== 'distance' || te < e.t) continue;
    const from = A.Target_root[dist][0], to = A.Target_root[e.to][0];
    const u = clamp((te - e.t) / e.dur, 0, 1);
    if (e.result === 'success') {
      x = lerp(from, to, easeOut(u));
      if (u >= 1) { dist = e.to; }
      state = { dist: u >= .5 ? e.to : dist, blocked: false, moving: u < 1, from: state.dist };
    } else {
      const reach = e.reach ?? (e.to === 'NEAR' ? .5 : .16), peak = e.peak ?? (e.to === 'NEAR' ? .5 : .3);
      const f = u < peak ? easeOut(u / peak) * reach : reach * (1 - easeInOut((u - peak) / (1 - peak)));
      x = from + (to - from) * f;
      state = { dist, blocked: u >= peak && te < e.t + e.dur + .5, moving: u < 1, attempt: e.to };
    }
  }
  return { x, y: A.Target_root.NEAR[1], state };
}
function scene(tl, te) {
  const lm = moveOffset(tl, 'LC', te), tm = moveOffset(tl, 'Target', te), tr = targetRoot(tl, te);
  const lc = { x: A.LC_root[0] + lm.x, y: A.LC_root[1] + lm.y, r: lm.r };
  const tg = { x: tr.x + tm.x, y: tr.y + tm.y, r: tm.r };   // target faces left: +x = knocked back (away from LC)
  return { lc, tg, dist: tr.state };
}
function anchorPos(sc, name) {
  const [who, key] = name.split('.');
  if (who === 'LC') { const o = A.LC[key]; return [sc.lc.x + o[0] * H, sc.lc.y + o[1] * H]; }
  const o = A.Target[key]; return [sc.tg.x + o[0] * H, sc.tg.y + o[1] * H];

  const used = [...new Set(tl.events.filter((e) => e.asset).map((e) => e.asset))];
  const dur = realDuration(tl), inStd = dur >= tl.std[0] - .001 && dur <= tl.std[1] + .001;
  const field = tl.skill === 'Qiangzhen' || tl.skill === 'Hengsaoqianjun';
  const peakOk = peak <= 1.505 || field;
  $('sheet').innerHTML = `
    <div class="eyebrow">当前演出</div>
    <h3>${tl.name}</h3>
    <div class="dna">${info.colors.map((c) => `<span class="chip" style="background:${c}"></span>`).join('')}<span>Wiki 图标视觉：<b>${info.dna}</b></span></div>
    <dl class="kv">
      <dt>机制</dt><dd>${info.mech}</dd>
      <dt>规则</dt><dd>${info.rule}</dd>
      <dt>类型</dt><dd>${tl.category} · 标准 ${tl.std[0].toFixed(2)}–${tl.std[1].toFixed(2)} s</dd>
      <dt>演出时长</dt><dd>${dur.toFixed(2)} s <span class="pill ${inStd ? 'ok' : 'info'}">${inStd ? '符合' : '含演示段'}</span></dd>
      <dt>命中段数</dt><dd>${hits} 段 <span class="pill ok">可数</span></dd>
      <dt>峰值尺寸</dt><dd>${peak.toFixed(2)} H <span class="pill ${peakOk ? 'ok' : 'warn'}">${peak <= 1.505 ? '≤ 1.5H' : '阵地/变距例外'}</span><br><span class="note">${peakKey}</span></dd>
      <dt>起始距离</dt><dd>${tl.setup.distance === 'NEAR' ? '近' : '远'}</dd>
      <dt>图层</dt><dd>${layers.join(' · ')}</dd>
    </dl>
    ${tl.note ? `<div class="note">${tl.note}</div>` : ''}
    <div><div class="eyebrow" style="margin-bottom:6px">使用素材 · ${used.length}</div>
    <ul class="assets-used">${used.map((k) => `<li><a href="#a-${k}">${k}</a> <span class="note">×${M.assets[k].files.length}</span></li>`).join('')}</ul></div>`;
}
function select(id, play) {
  S.id = id; S.tl = M.timelines[id]; S.t = 0; S.hold = 0;
  if (play) { S.playing = true; $('play').textContent = '暂停'; }
  document.querySelectorAll('.scn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
  buildLanes(S.tl); buildSheet(id, S.tl);
  try { localStorage.setItem('lc-vfx-scn', id); } catch (e) {}
}

// ---------------------------------------------------------------- gallery
const gCards = [];
let gbg = 'dark';
const checker = (() => { const c = document.createElement('canvas'); c.width = c.height = 16; const g = c.getContext('2d'); g.fillStyle = '#cfcfcf'; g.fillRect(0, 0, 16, 16); g.fillStyle = '#9a9a9a'; g.fillRect(0, 0, 8, 8); g.fillRect(8, 8, 8, 8); return c; })();
function buildGallery() {
  const root = $('gallery'); const groups = {};
  for (const [k, a] of Object.entries(M.assets)) (groups[a.group] ||= []).push([k, a]);
  const order = ['Jifengci', 'Huimaqiang', 'Hengsaoqianjun', 'Qiangzhen', 'Baozitou', 'CommonFX', 'UI'];
  let nFiles = 0;
  for (const g of order) {
    if (!groups[g]) continue;
    const sec = document.createElement('div'); sec.className = 'gal-group';
    const files = groups[g].reduce((s, [, a]) => s + a.files.length, 0); nFiles += files;
    sec.innerHTML = `<h4>${GROUP_NAME[g] || g}<span>${groups[g].length} 组 · ${files} 张</span></h4>`;
    const grid = document.createElement('div'); grid.className = 'grid';
    for (const [k, a] of groups[g]) {
      const card = document.createElement('article'); card.className = 'card'; card.id = 'a-' + k;
      const c = document.createElement('canvas'); c.width = 460; c.height = 288;
      card.appendChild(c);
      const info = document.createElement('div'); info.className = 'info';
      const fps = a.fps ? `${a.fps} fps` : a.files.length > 1 ? '变体' : '单帧';
      info.innerHTML = `<div class="key">${k}_${a.files.length > 1 ? '01–' + String(a.files.length).padStart(2, '0') : '01'}</div>
        <div class="dims">${a.files.length} 张 · ${fps} · ${a.size[0]}×${a.size[1]} px · ${a.size_H[0]}×${a.size_H[1]} H · anchor (${a.anchor[0]}, ${a.anchor[1]})</div>
        <div class="desc">${a.desc}</div><div class="path">${a.dir}/</div>`;
      card.appendChild(info); grid.appendChild(card);
      gCards.push({ k, a, c, g: c.getContext('2d'), last: -1 });
    }
    sec.appendChild(grid); root.appendChild(sec);
  }
  $('meta').textContent = `${Object.keys(M.assets).length} 组素材 · ${nFiles} 张 ${M.format.toUpperCase()} RGBA · ${Object.keys(M.timelines).length} 段演出`;
}
function animateGallery(now) {
  for (const cd of gCards) {
    const fr = imgs[cd.k]; if (!fr) continue;
    const n = fr.length, fps = cd.a.fps || 1.5;
    const cycle = n / fps + (cd.a.fps ? .5 : 0);
    const t = (now / 1000) % cycle, fi = Math.min(n - 1, Math.floor(t * fps));
    const key = fi + gbg; if (key === cd.last) continue; cd.last = key;
    const g = cd.g, W = cd.c.width, Hh = cd.c.height, im = fr[fi];
    if (gbg === 'checker') { g.fillStyle = g.createPattern(checker, 'repeat'); } else g.fillStyle = gbg === 'light' ? '#e9e4d8' : '#111419';
    g.fillRect(0, 0, W, Hh);
    if (!im.naturalWidth) continue;
    const s = Math.min((W - 24) / im.naturalWidth, (Hh - 24) / im.naturalHeight, 2);
    g.drawImage(im, (W - im.naturalWidth * s) / 2, (Hh - im.naturalHeight * s) / 2, im.naturalWidth * s, im.naturalHeight * s);
  }
}

// ---------------------------------------------------------------- controls
function segs(id, fn) {
  const el = $(id);
  el.addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return;
    el.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    fn(b.dataset.v);
  });
}
function bind() {
  $('play').addEventListener('click', () => {
    if (!S.playing && S.t >= realDuration(S.tl)) S.t = 0;
    S.playing = !S.playing; $('play').textContent = S.playing ? '暂停' : '播放';
  });
  $('restart').addEventListener('click', () => { S.t = 0; S.hold = 0; S.playing = true; $('play').textContent = '暂停'; });
  const step = (d) => { S.playing = false; $('play').textContent = '播放'; S.t = clamp(S.t + d, 0, realDuration(S.tl)); };
  $('stepb').addEventListener('click', () => step(-1 / 60));
  $('stepf').addEventListener('click', () => step(1 / 60));
  segs('speed', (v) => { S.speed = +v; });
  segs('bg', (v) => { S.bg = v; });
  segs('gbg', (v) => { gbg = v; });
  $('loop').addEventListener('change', (e) => { S.loop = e.target.checked; });
  $('debug').addEventListener('change', (e) => { S.debug = e.target.checked; });
  let drag = false;
  $('lanes').addEventListener('pointerdown', (e) => { drag = true; S.playing = false; $('play').textContent = '播放'; seekFromEvent(e); });
  addEventListener('pointermove', (e) => { if (drag) seekFromEvent(e); });
  addEventListener('pointerup', () => { drag = false; });
  addEventListener('keydown', (e) => {
    if (e.target.closest('input,textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
    if (e.code === 'ArrowRight') step(1 / 60);
    if (e.code === 'ArrowLeft') step(-1 / 60);
  });
}

buildRail(); bind(); buildGallery();
// small hook for automated capture / Cocos-side comparison: LCVFX.select('Jifengci_Hit'); LCVFX.seek(0.16)
window.LCVFX = { select: (id) => select(id, false), seek: (t) => { S.playing = false; $('play').textContent = '播放'; S.t = t; render(); }, timelines: M.timelines };
let first = Object.keys(M.timelines)[0];
try { const s = localStorage.getItem('lc-vfx-scn'); if (s && M.timelines[s]) first = s; } catch (e) {}
select(first, false);
if (reduced) { S.playing = false; $('play').textContent = '播放'; }
loadAll().then(() => {
  $('loading').hidden = true;
  if (!S.playing) { // show a representative still frame at the first hit
    const h = S.tl.events.find((e) => e.type === 'dmg'); if (h) S.t = h.t + .03;
  }
  requestAnimationFrame((n) => { last = n; tick(n); });
});
})();
</script>
