<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>林冲 · VFX 动效工坊</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="seal">斗</span><span>斗将录 <small>梁山篇 / VFX LAB</small></span></div><div class="edition"><i></i> 林冲全技能素材包 <span>SPEC V1.1</span></div></header>
<main><section class="intro"><div><p class="eyebrow">CHARACTER 01 / LIN CHONG</p><h1>枪出如风<span>林冲 · 豹子头</span></h1></div><p class="intro-note">五种视觉 DNA，一套枪术语言。<br>选择技能，检视出招、命中与机制反馈。</p></section>
<nav id="skills" aria-label="技能选择"></nav>
<section class="workspace"><div class="viewer"><div class="viewer-head"><span><i class="live"></i> 实时动效预览</span><div><label><input type="checkbox" id="guides" checked> 标靶 / Anchor</label><select id="background" aria-label="背景"><option value="dark">深色战场</option><option value="light">浅色验收</option><option value="grid">透明棋盘验收</option></select><button id="full" title="全屏">⛶</button></div></div><canvas id="stage" width="1920" height="1080" aria-label="林冲技能动效"></canvas><div class="transport"><button id="play" class="primary">暂停</button><button id="restart">↺ 重播</button><select id="speed" aria-label="播放速度"><option value="0.25">0.25× 慢放</option><option value="0.5">0.5× 慢放</option><option value="1" selected>1× 原速</option></select><span id="time">0.00 / 2.30 s</span><label><input id="loop" type="checkbox" checked> 循环</label></div><input id="scrub" type="range" min="0" max="2.3" step="0.001" value="0" aria-label="时间轴"><div id="timeline"></div></div>
<aside><p class="eyebrow">SKILL BREAKDOWN</p><div class="skill-heading"><img id="icon" alt="Wiki 技能母版"><div><h2 id="name"></h2><p id="subtitle"></p></div></div><div class="dna" id="dna"></div><div class="facts"><div><small>核心演出</small><strong id="duration"></strong></div><div><small>伤害 / 机制</small><strong id="damage"></strong></div></div><label class="field-label" for="branch">机制分支</label><select id="branch"></select><p id="rule" class="rule"></p><div class="phase"><small>当前事件</small><strong id="phase">准备</strong></div><div id="events" class="events"></div><p class="note">状态等待时间为演示压缩；正式战斗由事件触发。预览标靶和文字不会进入透明素材。</p></aside></section>
<section class="asset-section"><div class="section-heading"><div><p class="eyebrow">LAYERED COMPONENTS</p><h2>可独立组合的透明素材</h2></div><span id="asset-count"></span></div><div id="gallery"></div></section>
<footer><span>1920 × 1080 基准 · RGBA PNG · 独立 Hit · 事件驱动</span><a href="../README.md">交付说明 ↗</a></footer></main>
<script src="assets.js?v=3"></script><script src="timelines.js?v=3"></script><script src="player.js?v=3"></script></body></html>
